name: data-refresh
# クラウド完全独立運転: 6時間ごとにパイプラインを実行し、結果JSONをコミット。
# サイトはGitHub Pagesがmainブランチから直接配信する。
on:
  schedule:
    - cron: "17 */6 * * *"     # UTC 6時間ごと（GitHub cronは±15〜60分の遅延あり）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Run pipeline
        working-directory: pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}          # GitHub APIレート緩和
          NTFY_TOPIC: ${{ vars.NTFY_TOPIC }}                 # スマホプッシュ通知
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }} # 任意（LLM判定）
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}      # Tiingo EOD（保有期間トレンド）
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}            # FMP（PEAD・格付イベント）
        run: python refresh.py

      - name: Commit data
        run: |
          git config user.name "ngs-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live/
          git commit -m "data refresh $(date -u '+%Y-%m-%d %H:%M UTC')" || echo "no changes"
          git pull --rebase origin main || true
          git push
